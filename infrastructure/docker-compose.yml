services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ADME_DATA_DIR=/app/data/synthetic
      - ADME_SAGEMAKER_MODE=local_simulation
      - ADME_SNOWFLAKE_MODE=local_simulation
    volumes:
      - ../data:/app/data
      - ../knowledge-base:/app/knowledge-base

  web:
    build:
      context: ../adme_platform/web
      dockerfile: ../../infrastructure/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=
    depends_on:
      - api
